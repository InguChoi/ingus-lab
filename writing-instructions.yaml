version: 6
language: switchable
purpose: >
  Ingus Lab에 올릴 글을 작성하거나 수정할 때 매번 프롬프트로 반복하지 않아도
  되는 상시 작성 지시 사항입니다. 모든 글은 한국어와 영어 원고를 모두 준비하되,
  화면에서는 언어 스위치로 선택한 언어만 보이게 작성합니다.

language_modes:
  default: switchable
  modes:
    korean:
      code: ko-KR
      role: 기본 해설 언어
      instruction: 한국어 독자가 먼저 읽을 수 있도록 자연스럽고 명확한 한국어로 작성합니다.
    english:
      code: en
      role: 병행 제공 언어
      instruction: 한국어 본문과 같은 핵심을 담되, 직역보다 자연스러운 영어 연구 노트 톤으로 작성합니다.
    switchable:
      code: ko-KR + en
      role: 기본 발행 형식
      instruction: 한국어 버전과 영어 버전을 모두 작성하지만, 독자에게는 선택한 언어 하나만 보이게 합니다.
  switchable_format:
    content_blocks:
      korean: '<section data-lang="ko">...</section>'
      english: '<section data-lang="en">...</section>'
    section_labels:
      korean: ko
      english: en
    rules:
      - 본문은 한국어 블록과 영어 블록을 분리해서 작성합니다.
      - 언어 블록 바깥에는 두 언어에 공통으로 보여도 되는 요소만 둡니다.
      - 영어 본문은 한국어 문장의 축약 번역이 아니라 독립적으로 읽히는 완성된 글이어야 합니다.
      - titleKo, titleEn, descriptionKo, descriptionEn을 함께 작성합니다.
      - 기본 title과 description은 한국어 값을 넣되, 기존 목록과 RSS 호환을 위해 유지합니다.
      - Source 섹션은 공통으로 한 번만 둘 수 있고, 필요하면 각 언어 블록 안에 따로 둘 수도 있습니다.
      - 숫자, 날짜, 모델명, 논문명, 제품명, 링크는 두 언어 버전에서 일관되게 유지합니다.

global:
  audience:
    - AI, 로보틱스, 개발자 도구, 제품 아이디어에 관심 있는 한국어 및 영어 독자
    - 논문 원문이나 기술 발표를 모두 읽지는 않았지만 핵심 의미를 알고 싶은 독자
    - 기술의 작동 방식뿐 아니라 연구, 제품, 시장의 함의를 함께 보고 싶은 독자
  voice:
    - 차분하고 분석적인 연구 노트 톤
    - 과장된 홍보 문구보다 관찰, 해석, 한계, 다음 질문을 우선
    - 문장은 짧고 명확하게 쓰되, 지나치게 건조하지 않게 작성
    - 영어 본문도 한국어 본문과 같은 수준의 분석 밀도를 유지
  structure:
    - 제목은 구체적으로 작성하고, 가능하면 대상과 관점을 함께 드러낼 것
    - 첫 문단에서 글의 대상과 왜 지금 중요한지 설명할 것
    - 본문은 의미 단위마다 소제목을 둘 것
    - 모든 글에는 참고하는 홈페이지, 논문 페이지, 발표 페이지에 포함된 figure 또는 concept image를 최소 하나 포함할 것
    - 마지막에는 작성자가 직접 덧붙일 수 있는 Ingus Lab 댓글 영역을 둘 것
    - 외부 자료를 참고했다면 하단에 Source 섹션을 둘 것
  style:
    - 불필요한 영어 남용을 피하되, 모델명, 제품명, 기술 용어는 원문 표기를 유지
    - 확정할 수 없는 내용은 추정처럼 표현하고 단정하지 말 것
    - 숫자, 날짜, 벤치마크, 인용은 가능한 한 정확히 적을 것
    - 독자가 바로 얻어갈 수 있는 핵심 문장을 각 섹션에 하나 이상 둘 것
    - 한국어와 영어 중 한쪽에만 중요한 정보가 빠지지 않게 할 것
    - 단어가 줄 끝에서 글자 단위로 잘리지 않게 작성하고, UI에서도 단어 잘림을 허용하지 말 것
  frontmatter:
    required:
      title: string
      description: string
      category: papers | trends | concept
      pubDate: date
    optional:
      titleKo: string
      titleEn: string
      descriptionKo: string
      descriptionEn: string
      updatedDate: date
      heroImage: string
    note:
      - 새 글은 titleKo, titleEn, descriptionKo, descriptionEn을 함께 작성합니다.
      - title과 description은 한국어 기본값으로 유지합니다.
      - heroImage에는 가능하면 참고 홈페이지의 대표 figure 또는 concept image를 사용합니다.
      - 현재 Astro 스키마에서는 기술 개념 리뷰도 category 값으로 concept를 사용합니다.
      - 화면이나 글 내부에서는 필요하면 Technical Concepts 또는 Concepts라는 표시명을 사용할 수 있습니다.

media:
  requirement: 모든 글은 참고 자료에서 가져온 대표 figure 또는 concept image를 포함합니다.
  priority:
    - 참고하는 공식 홈페이지, 논문 프로젝트 페이지, 기업 발표 페이지에 포함된 대표 figure
    - 논문이나 기술 설명에 직접 등장하는 architecture diagram, pipeline figure, benchmark figure
    - 기술 개념을 설명하는 concept image, product screenshot, robot/demo image
    - 위 자료가 없을 때만 직접 만든 보조 이미지 또는 기존 placeholder 사용
  usage:
    - 가능하면 대표 이미지를 heroImage로 지정합니다.
    - 본문 이해에 도움이 되는 figure는 이미지 아래에 짧은 caption을 붙입니다.
    - caption에는 이미지가 무엇을 보여주는지와 출처 페이지를 함께 적습니다.
    - 이미지가 한국어와 영어 양쪽 본문에 모두 필요한 경우 언어 블록 바깥에 배치할 수 있습니다.
    - 특정 언어 본문 안에서만 설명하는 이미지라면 해당 data-lang 블록 안에 배치합니다.
  attribution:
    - 외부 이미지를 사용할 때는 Source 섹션에 원본 페이지 링크를 반드시 포함합니다.
    - 이미지 출처가 논문, 프로젝트 페이지, 회사 블로그 중 어디인지 명확히 적습니다.
    - 라이선스나 재사용 가능 여부가 불명확하면 원본을 그대로 복제하기보다 원본 페이지 링크와 함께 제한적으로 사용합니다.
  avoid:
    - 글 내용과 직접 관련 없는 장식용 stock image
    - 어둡거나 잘린 이미지처럼 기술 내용을 확인하기 어려운 이미지
    - 출처를 알 수 없는 이미지
    - 참고 자료에 좋은 figure가 있는데 placeholder만 사용하는 방식

author_comment:
  label:
    korean: Ingus Lab 댓글
    english: Ingus Lab Comment
  purpose: 글 작성자가 독자에게 댓글을 남기듯 개인적인 해석, 질문, 다음 생각을 덧붙이는 영역입니다.
  rules:
    - 본문 분석과 분리된 짧은 코멘트 영역으로 작성합니다.
    - 결론을 대신 완성하기보다 작성자가 나중에 고치거나 덧붙일 수 있는 여지를 남깁니다.
    - 톤은 연구 노트의 여백에 남기는 댓글처럼 개인적이되, 과장하거나 단정하지 않습니다.
    - 자동 작성 시에는 너무 길게 쓰지 말고 2-4문장 정도로 제한합니다.
    - 사용자가 직접 채울 수 있게 비워두어야 할 때는 TODO 문구를 남깁니다.
  optional_placeholder:
    korean: "<!-- TODO: Ingus Lab 댓글을 직접 추가하기 -->"
    english: "<!-- TODO: Add Ingus Lab Comment -->"

typography:
  no_word_break:
    requirement: 단어 잘림을 허용하지 않습니다.
    rules:
      - 한국어와 영어 모두 단어가 줄 끝에서 글자 단위로 쪼개지지 않게 합니다.
      - CSS에서는 word-break: break-all, overflow-wrap: anywhere, overflow-wrap: break-word를 사용하지 않습니다.
      - 긴 URL, 코드, 모델명, 파일명은 단어를 자르지 말고 가로 스크롤이나 레이아웃 확장으로 처리합니다.
      - 제목, 버튼, 카드, 목록 설명에서도 단어가 임의로 잘리지 않게 확인합니다.

categories:
  papers:
    label: Papers
    purpose: 논문이나 연구 결과를 읽고 핵심 기여, 방법, 한계, 응용 가능성을 정리합니다.
    required_focus:
      - 이 논문이 풀려는 문제
      - 기존 접근과 다른 점
      - 방법론의 핵심 아이디어
      - 실험 결과가 실제로 말해주는 것
      - 한계와 후속 질문
    preferred_sections:
      korean:
        - 왜 중요한가
        - 핵심 아이디어
        - 방법과 설계
        - 결과 읽기
        - 한계
        - Ingus Lab 댓글
      english:
        - Why It Matters
        - Core Idea
        - Method and Design
        - Reading the Results
        - Limitations
        - Ingus Lab Comment
    avoid:
      - 초록을 단순 번역한 요약
      - 수식이나 세부 구현만 나열하는 방식
      - 성능 수치를 맥락 없이 크게 보이게 쓰는 방식

  trends:
    label: Trends
    purpose: 새 제품, 모델, 기업 발표, 기술 흐름을 관찰하고 그 의미를 해석합니다.
    required_focus:
      - 무엇이 새로 나왔는지
      - 기존 흐름과 어떻게 이어지는지
      - 사용자, 개발자, 시장 또는 연구 방향에 주는 신호
      - 과장과 실제 변화 가능성을 구분
    preferred_sections:
      korean:
        - 무엇이 나왔나
        - 왜 중요한가
        - 기술적 신호
        - 시장 또는 제품 관점
        - Ingus Lab 댓글
      english:
        - What Changed
        - Why It Matters
        - Technical Signals
        - Market or Product View
        - Ingus Lab Comment
    avoid:
      - 보도자료를 그대로 반복하는 문장
      - 근거 없는 승자 예측
      - 최신성만 강조하고 구조적 의미를 놓치는 글

  concept:
    label: Technical Concepts
    aliases:
      - Concepts
      - Technical Concepts
      - Core Technologies
    purpose: AI 혹은 로봇 분야에서 전반적으로 쓰이는 핵심 기술, 개념, 방법론을 리뷰합니다.
    usage_note:
      - 기존 사이트 스키마와 URL을 유지하기 위해 frontmatter category 값은 concept를 사용합니다.
      - 글의 표시명이나 섹션명은 Technical Concepts를 우선 사용합니다.
      - 제품 아이디어 스케치가 아니라 기술 개념 리뷰로 작성합니다.
    required_focus:
      - 이 기술 또는 개념이 해결하려는 문제
      - AI나 로봇 시스템에서 쓰이는 맥락
      - 핵심 작동 원리
      - 대표적인 방법, 변형, 관련 용어
      - 실제 적용 사례와 한계
      - 처음 공부하는 독자가 붙잡아야 할 직관
    preferred_sections:
      korean:
        - 개념 요약
        - 왜 필요한가
        - 작동 원리
        - AI와 로봇에서의 사용
        - 한계와 주의점
        - Ingus Lab 댓글
      english:
        - Concept Summary
        - Why It Is Needed
        - How It Works
        - Use in AI and Robotics
        - Limits and Caveats
        - Ingus Lab Comment
    avoid:
      - 제품 아이디어나 인터페이스 구상 중심의 글
      - 교과서식 정의만 나열하는 글
      - 수식, 용어, 구현 세부사항을 맥락 없이 쌓아두는 글
      - 기술의 한계나 실패 조건을 생략하는 글

workflow:
  before_writing:
    - 작성할 글의 category를 먼저 정한다.
    - category별 required_focus를 체크리스트처럼 확인한다.
    - 참고 자료가 있으면 사실과 해석을 분리해서 메모한다.
    - 참고 홈페이지에서 사용할 수 있는 figure, concept image, architecture diagram, screenshot을 먼저 확인한다.
    - 한국어와 영어를 모두 작성할 수 있도록 핵심 주장과 용어 번역을 미리 정리한다.
  while_writing:
    - global.voice와 global.style을 우선 적용한다.
    - language_modes.switchable_format을 기본 형식으로 사용한다.
    - media.requirement에 따라 대표 이미지 또는 본문 figure를 포함한다.
    - category별 preferred_sections는 필요에 따라 합치거나 이름을 바꿀 수 있다.
    - author_comment 규칙에 따라 Ingus Lab 댓글을 별도 코멘트 영역처럼 작성하거나 TODO로 남긴다.
    - 독자가 모를 수 있는 고유명사와 약어는 처음 한 번 설명한다.
    - 한국어 본문과 영어 본문 사이에 핵심 정보의 차이가 생기지 않도록 확인한다.
  before_publishing:
    - frontmatter가 src/content.config.ts 스키마와 맞는지 확인한다.
    - 새 글에는 titleKo, titleEn, descriptionKo, descriptionEn을 넣었는지 확인한다.
    - category 값이 papers, trends, concept 중 하나인지 확인한다.
    - 기술 개념 리뷰는 표시명이 Technical Concepts여도 frontmatter category는 concept로 둔다.
    - heroImage 또는 본문 이미지가 참고 자료의 figure/concept image인지 확인한다.
    - 이미지 caption과 Source 섹션에 출처 링크가 있는지 확인한다.
    - Ingus Lab 댓글이 본문 분석과 분리되어 있고, 사용자가 직접 댓글처럼 수정할 수 있는 형태인지 확인한다.
    - 본문에 data-lang="ko" 블록과 data-lang="en" 블록이 모두 있는지 확인한다.
    - 단어가 줄 끝에서 글자 단위로 잘리지 않는지 모바일과 데스크톱 폭에서 확인한다.
    - 한글이 깨지지 않도록 UTF-8로 저장한다.
    - 링크, 날짜, 숫자, 출처를 다시 확인한다.
